name: Selective Branch and Path Filtering

on:
  push:
    branches:
      - dev
      - release/*
    paths-ignore:
      - 'docs/**'

jobs:
  test-filters:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger event
        run: |
          echo "Workflow triggered by ${{ github.event_name }}"
          echo "Branch: ${{ github.ref }}"
